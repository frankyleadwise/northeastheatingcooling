<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>

  <defs>
    <radialGradient id="orbGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="40%" stop-color="#f03a17"/>
      <stop offset="100%" stop-color="#c0200a"/>
    </radialGradient>
    <linearGradient id="stemOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea8c0a"/>
    </linearGradient>
    <linearGradient id="stemBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Gray outer circle frame (partial arcs) -->
  <!-- Top arc -->
  <path d="M 160 190 A 120 120 0 0 1 340 190" fill="none" stroke="#b0b0b0" stroke-width="16" stroke-linecap="round"/>
  <!-- Bottom arc -->
  <path d="M 175 330 A 120 120 0 0 0 325 330" fill="none" stroke="#b0b0b0" stroke-width="16" stroke-linecap="round"/>
  <!-- Left vertical bracket arm -->
  <line x1="160" y1="190" x2="155" y2="265" stroke="#b0b0b0" stroke-width="16" stroke-linecap="round"/>
  <!-- Right vertical bracket arm -->
  <line x1="340" y1="190" x2="345" y2="265" stroke="#b0b0b0" stroke-width="16" stroke-linecap="round"/>

  <!-- Orange stem upper -->
  <rect x="237" y="115" width="26" height="110" rx="7" fill="url(#stemOrange)"/>

  <!-- Red/orange orb -->
  <circle cx="250" cy="100" r="46" fill="url(#orbGrad)"/>
  <!-- Orb highlight shine -->
  <ellipse cx="237" cy="86" rx="16" ry="11" fill="rgba(255,200,100,0.45)" transform="rotate(-15,237,86)"/>

  <!-- Blue lower stem / tube -->
  <!-- Tube body -->
  <rect x="237" y="270" width="26" height="90" rx="13" fill="url(#tubeGrad)"/>
  <!-- Tube rounded bottom cap -->
  <ellipse cx="250" cy="360" rx="13" ry="13" fill="#1e40af"/>
  <!-- Tube inner shade -->
  <rect x="242" y="275" width="10" height="75" rx="5" fill="rgba(255,255,255,0.25)"/>

  <!-- Three wavy lines (drawn over/through stem) -->
  <!-- Wave 1 (top) -->
  <path d="M 108 228 C 140 212, 170 244, 202 228 C 234 212, 260 212, 298 228 C 320 238, 348 244, 392 228"
        fill="none" stroke="url(#wave1)" stroke-width="10" stroke-linecap="round"/>
  <!-- Wave 2 (middle) -->
  <path d="M 108 256 C 140 240, 170 272, 202 256 C 234 240, 260 240, 298 256 C 320 266, 348 272, 392 256"
        fill="none" stroke="url(#wave2)" stroke-width="10" stroke-linecap="round"/>
  <!-- Wave 3 (bottom) -->
  <path d="M 108 284 C 140 268, 170 300, 202 284 C 234 268, 260 268, 298 284 C 320 294, 348 300, 392 284"
        fill="none" stroke="url(#wave3)" stroke-width="10" stroke-linecap="round"/>
</svg>
