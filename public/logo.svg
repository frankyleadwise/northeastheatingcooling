<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130">
  <defs>
    <radialGradient id="orbGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffcc44"/>
      <stop offset="30%" stop-color="#f05010"/>
      <stop offset="100%" stop-color="#aa1a04"/>
    </radialGradient>
    <linearGradient id="stemOr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2600a"/>
    </linearGradient>
    <linearGradient id="tubeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <!-- Wave gradients: blue-left → red-right, matching original -->
    <linearGradient id="wA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1d3fbb"/>
      <stop offset="45%"  stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#c81414"/>
    </linearGradient>
    <linearGradient id="wB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e4ed8"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="wC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="55%"  stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Icon: original 500×500 coords scaled by 0.245, offset to centre vertically -->
  <g transform="translate(2, 8) scale(0.245)">

    <!-- Outer grey circular frame: top arc + side arms + bottom arc -->
    <path d="M 155 195 A 125 125 0 0 1 345 195"
          fill="none" stroke="#9ca3af" stroke-width="20" stroke-linecap="round"/>
    <line x1="155" y1="195" x2="148" y2="280"
          stroke="#9ca3af" stroke-width="20" stroke-linecap="round"/>
    <line x1="345" y1="195" x2="352" y2="280"
          stroke="#9ca3af" stroke-width="20" stroke-linecap="round"/>
    <path d="M 178 336 A 125 125 0 0 0 322 336"
          fill="none" stroke="#9ca3af" stroke-width="20" stroke-linecap="round"/>

    <!-- Orange upper stem -->
    <rect x="236" y="120" width="28" height="100" rx="8" fill="url(#stemOr)"/>

    <!-- Red/orange orb with gloss -->
    <circle cx="250" cy="96" r="52" fill="url(#orbGrad)"/>
    <ellipse cx="231" cy="78" rx="20" ry="13"
             fill="rgba(255,220,130,0.42)" transform="rotate(-20,231,78)"/>

    <!-- Three wavy lines spanning the frame -->
    <path d="M 100 232 C 136 212, 174 252, 208 232 C 236 214, 264 214, 300 232 C 326 244, 356 252, 400 232"
          fill="none" stroke="url(#wA)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 100 264 C 136 244, 174 284, 208 264 C 236 246, 264 246, 300 264 C 326 276, 356 284, 400 264"
          fill="none" stroke="url(#wB)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 100 296 C 136 276, 174 316, 208 296 C 236 278, 264 278, 300 296 C 326 308, 356 316, 400 296"
          fill="none" stroke="url(#wC)" stroke-width="13" stroke-linecap="round"/>

    <!-- Blue lower tube (thermometer bulb) -->
    <rect x="236" y="276" width="28" height="84" rx="14" fill="url(#tubeG)"/>
    <ellipse cx="250" cy="360" rx="14" ry="14" fill="#1e3a8a"/>
    <rect x="242" y="282" width="10" height="68" rx="5" fill="rgba(255,255,255,0.20)"/>
  </g>

  <!-- Company name: white text for dark header -->
  <text
    x="128" y="68"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="48"
    letter-spacing="1"
    fill="#ffffff"
  >NORTH EAST</text>

  <text
    x="130" y="100"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="20"
    letter-spacing="4"
    fill="#bfdbfe"
  >HEATING AND COOLING</text>
</svg>
