<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 178">
  <defs>
    <!-- Orb: bright yellow-orange highlight → deep red edge -->
    <radialGradient id="orb" cx="34%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#ffe860"/>
      <stop offset="18%"  stop-color="#f07010"/>
      <stop offset="62%"  stop-color="#cc2010"/>
      <stop offset="100%" stop-color="#8b0804"/>
    </radialGradient>
    <!-- Orange stem: darker edges, bright centre -->
    <linearGradient id="sOr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9a3810"/>
      <stop offset="50%"  stop-color="#e88020"/>
      <stop offset="100%" stop-color="#9a3810"/>
    </linearGradient>
    <!-- Blue stem -->
    <linearGradient id="sBl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0e28a0"/>
      <stop offset="50%"  stop-color="#44a0f0"/>
      <stop offset="100%" stop-color="#0e28a0"/>
    </linearGradient>
    <!-- U-tube: sky blue top → deep navy bottom -->
    <linearGradient id="tub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#80ccff"/>
      <stop offset="100%" stop-color="#0424a8"/>
    </linearGradient>
    <!-- Waves: dark blue left → deep red right -->
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1628c8"/>
      <stop offset="48%"  stop-color="#7018b0"/>
      <stop offset="100%" stop-color="#c81010"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2038d8"/>
      <stop offset="48%"  stop-color="#6028c0"/>
      <stop offset="100%" stop-color="#d82020"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3048e8"/>
      <stop offset="48%"  stop-color="#5038d0"/>
      <stop offset="100%" stop-color="#e83030"/>
    </linearGradient>
  </defs>

  <!--
    ICON — circle center (89, 89), radius 67.
    Circle top y=22, bottom y=156.
    Orb at y=48 r=27 → top at y=21, sits snug inside top of ring.
  -->

  <!-- Outer grey ring -->
  <circle cx="89" cy="89" r="67" fill="none" stroke="#9ca3af" stroke-width="10"/>
  <!-- Inner ring line (double-ring accent visible at top) -->
  <circle cx="89" cy="89" r="55" fill="none" stroke="#bdc5cf" stroke-width="3.5"/>

  <!-- Orange upper stem (below orb, above waves) -->
  <rect x="82" y="73" width="14" height="34" rx="6" fill="url(#sOr)"/>

  <!-- Orb (large, glowing red/orange ball) -->
  <circle cx="89" cy="48" r="27" fill="url(#orb)"/>
  <!-- Glossy highlight spot -->
  <ellipse cx="79" cy="38" rx="11" ry="7.5"
           fill="rgba(255,238,140,0.52)" transform="rotate(-22,79,38)"/>

  <!--
    Three waves — all S-curve: start centre, dip up-left, dip down-right, end centre.
    They span x=14 to x=164, extending beyond the circle (x=22..156) on both sides.
    Stacked at y=104, 119, 134.
  -->
  <path d="M 14,104 C 50,90 126,118 162,104"
        fill="none" stroke="url(#w1)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 14,119 C 50,105 126,133 162,119"
        fill="none" stroke="url(#w2)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 14,134 C 50,120 126,148 162,134"
        fill="none" stroke="url(#w3)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Connector tabs flanking the lower stem (inside circle bottom area) -->
  <rect x="67" y="143" width="13" height="10" rx="3" fill="#9ca3af"/>
  <rect x="98" y="143" width="13" height="10" rx="3" fill="#9ca3af"/>

  <!-- Blue lower stem -->
  <rect x="82" y="140" width="14" height="20" rx="6" fill="url(#sBl)"/>

  <!-- U-tube (thermometer bulb — extends slightly below circle bottom) -->
  <rect x="73" y="155" width="32" height="26" rx="12" fill="url(#tub)"/>
  <!-- Inner shine -->
  <rect x="79" y="160" width="9" height="16" rx="4"
        fill="rgba(210,240,255,0.30)"/>

  <!-- TEXT — all white, Times New Roman MT -->
  <text
    x="182" y="99"
    font-family="'Times New Roman MT', 'Times New Roman', TimesNewRomanMT, 'Times New Roman PS', Times, serif"
    font-weight="700"
    font-size="55"
    fill="#ffffff"
    letter-spacing="1.5">NORTH EAST</text>

  <text
    x="184" y="133"
    font-family="'Times New Roman MT', 'Times New Roman', TimesNewRomanMT, 'Times New Roman PS', Times, serif"
    font-weight="400"
    font-size="23"
    fill="#ffffff"
    letter-spacing="3.5">HEATING AND COOLING</text>
</svg>
